services:
  - type: web
    name: sri-sai-lakshmi-mess-api
    env: node
    rootDir: "Sri Sai lakshmi mess/server"
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
